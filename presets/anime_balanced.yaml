meta:
  id: anime_balanced
  name: Anime Balanced 1440p
  description: >
    Default preset. Strong line-art fidelity for cel anime with sensible speed.
    Anime4K ACNet+HDN 2x (CUDA with OpenCL fallback) + RIFE v4.22-lite 2x interpolation + HEVC NVENC at p6/CQ19.
    Tuned for RTX 3080 10GB.
  builtin: true
  suitable_for: [anime_2d, anime_compressed]
  target_hardware: "RTX 3080 10GB"
container: mkv
target_resolution:
  mode: named
  named: "1440p"
upscaler:
  engine: anime4kcpp-vs
  model: acnet-hdn0
  scale: 2
  denoise: 1
  tile_size: 256
  fp16: true
  enabled: true
interpolation:
  enabled: true
  engine: rife-ncnn-vulkan
  version: v4.25-lite
  target_fps: null
  multiplier: 2
  scene_cut_threshold: 0.35
  duplicate_on_scene_cut: true
  fp16: true
encoder:
  name: hevc_nvenc
  nvenc_preset: p6
  nvenc_tune: hq
  nvenc_rc: vbr
  nvenc_cq: 19
  nvenc_multipass: fullres
  nvenc_spatial_aq: true
  nvenc_temporal_aq: true
  nvenc_bframes: 3
  nvenc_b_ref_mode: middle
  x_crf: 18
  x_preset: slow
  x_tune: animation
  extra_args: []
streams:
  copy_audio: true
  copy_subtitles: true
  copy_chapters: true
  copy_attachments: true
  copy_global_metadata: true
  copy_stream_metadata: true
  copy_dispositions: true
  burn_in_subtitles: false
postprocess:
  enabled: false
  deband: false
  deblock: false
  grain_addback: 0
