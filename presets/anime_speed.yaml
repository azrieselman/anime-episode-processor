meta:
  id: anime_speed
  name: Anime Speed
  description: >
    Fastest acceptable preset. Real-ESRGAN animevideov3 2x, RIFE v4.22-lite,
    H.264 NVENC p4. Use for batch jobs where time matters more than absolute fidelity.
  builtin: true
  suitable_for: [anime_2d]
  target_hardware: "RTX 3000 series, 8GB+ VRAM"
container: mkv
target_resolution:
  mode: named
  named: "1080p"
upscaler:
  engine: realesrgan-ncnn-vulkan
  model: realesr-animevideov3
  scale: 2
  denoise: -1
  tile_size: 256
  fp16: true
  enabled: true
interpolation:
  enabled: true
  engine: rife-ncnn-vulkan
  version: v4.22-lite
  target_fps: 60
  scene_cut_threshold: 0.4
  duplicate_on_scene_cut: true
  fp16: true
encoder:
  name: h264_nvenc
  nvenc_preset: p4
  nvenc_tune: hq
  nvenc_rc: vbr
  nvenc_cq: 22
  nvenc_multipass: qres
  nvenc_spatial_aq: true
  nvenc_temporal_aq: false
  nvenc_bframes: 3
  nvenc_b_ref_mode: middle
  x_crf: 20
  x_preset: medium
  x_tune: animation
  extra_args: []
streams:
  copy_audio: true
  copy_subtitles: true
  copy_chapters: true
  copy_attachments: true
  copy_global_metadata: true
  copy_stream_metadata: true
  copy_dispositions: true
  burn_in_subtitles: false
postprocess:
  enabled: false
  deband: false
  deblock: false
  grain_addback: 0
