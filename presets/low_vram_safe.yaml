meta:
  id: low_vram_safe
  name: Low VRAM Safe
  description: >
    Tile size capped at 128, lite RIFE, NVENC p4 — avoids OOM on cards with limited
    free VRAM (e.g. shared GPU usage or 8GB cards).
  builtin: true
  suitable_for: [anime_2d]
  target_hardware: "8GB VRAM or shared GPU"
container: mkv
target_resolution:
  mode: named
  named: "1080p"
upscaler:
  engine: realcugan-ncnn-vulkan
  model: models-se
  scale: 2
  denoise: 3
  tile_size: 128
  fp16: true
  enabled: true
interpolation:
  enabled: true
  engine: rife-ncnn-vulkan
  version: v4.22-lite
  target_fps: 48
  scene_cut_threshold: 0.4
  duplicate_on_scene_cut: true
  fp16: true
encoder:
  name: hevc_nvenc
  nvenc_preset: p4
  nvenc_tune: hq
  nvenc_rc: vbr
  nvenc_cq: 22
  nvenc_multipass: qres
  nvenc_spatial_aq: true
  nvenc_temporal_aq: false
  nvenc_bframes: 3
  nvenc_b_ref_mode: middle
  x_crf: 21
  x_preset: medium
  x_tune: animation
  extra_args: []
streams:
  copy_audio: true
  copy_subtitles: true
  copy_chapters: true
  copy_attachments: true
  copy_global_metadata: true
  copy_stream_metadata: true
  copy_dispositions: true
  burn_in_subtitles: false
postprocess:
  enabled: false
  deband: false
  deblock: false
  grain_addback: 0
