meta:
  id: anime_speed
  name: Anime Speed
  description: >
    Fastest acceptable anime preset. Real-ESRGAN animevideov3 2x and RIFE
    v4.22-lite target high throughput with tuned settings across NVENC, QSV,
    and AMF encoders.
  builtin: true
  suitable_for: [anime_2d]
  target_hardware: "Any recent GPU with hardware encode support"
container: mkv
target_resolution:
  mode: named
  named: "1080p"
upscaler:
  engine: realesrgan-ncnn-vulkan
  model: realesr-animevideov3
  scale: 2
  denoise: -1
  tile_size: 256
  fp16: true
  enabled: true
interpolation:
  enabled: true
  engine: rife-ncnn-vulkan
  version: v4.22-lite
  target_fps: 60
  scene_cut_threshold: 0.4
  duplicate_on_scene_cut: true
  fp16: true
encoder:
  name: h264_nvenc
  goal: speed
  nvenc_preset: p4
  nvenc_tune: hq
  nvenc_rc: vbr
  nvenc_cq: 22
  nvenc_multipass: qres
  nvenc_rc_lookahead: 16
  nvenc_spatial_aq: true
  nvenc_temporal_aq: false
  nvenc_bframes: 3
  nvenc_b_ref_mode: middle
  qsv_preset: veryfast
  qsv_global_quality: 27
  qsv_extbrc: true
  qsv_look_ahead_depth: 12
  qsv_bf: 2
  qsv_low_power: true
  amf_quality: speed
  amf_rc: cqp
  amf_qp_i: 22
  amf_qp_p: 22
  amf_qp_b: 24
  amf_preanalysis: false
  amf_vbaq: false
  amf_g: 180
  x_crf: 20
  x_preset: medium
  x_tune: animation
  x265_params: aq-mode=3:psy-rd=2.0:psy-rdoq=1.0:rd=4
  extra_args: []
decode:
  hwaccel: auto
  png_intermediate_codec: mjpeg
streams:
  copy_audio: true
  copy_subtitles: true
  copy_chapters: true
  copy_attachments: true
  copy_global_metadata: true
  copy_stream_metadata: true
  copy_dispositions: true
  burn_in_subtitles: false
postprocess:
  enabled: false
  deband: false
  deblock: false
  grain_addback: 0
