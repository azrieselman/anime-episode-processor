meta:
  id: anime_balanced
  name: Anime Balanced 1440p
  description: >
    Default preset with strong line-art fidelity and balanced speed.
    Anime4K ARTCNN 2x plus RIFE v4.25 2x interpolation, tuned
    with parity settings for NVENC, QSV, and AMF paths.
  builtin: true
  suitable_for: [anime_2d, anime_compressed]
  target_hardware: "Modern NVIDIA, Intel, or AMD GPU; CPU fallback supported"
container: mkv
target_resolution:
  mode: named
  named: 1440p
  width: null
  height: null
upscaler:
  engine: anime4kcpp
  model: artcnn-c4f32
  scale: 2
  denoise: 1
  tile_size: 256
  fp16: true
  enabled: true
  tta: false
  intermediate_format: png
  hdr_policy: allow_8bit_roundtrip
interpolation:
  enabled: true
  engine: rife-ncnn-vulkan
  version: v4.25
  target_fps: null
  multiplier: 2
  scene_cut_threshold: 0.35
  duplicate_on_scene_cut: true
  fp16: true
  scene_detect_backend: ffmpeg_scdet
  scene_change_threshold_percent: 35.0
  ffmpeg_scdet_scale_width: 320
encoder:
  name: hevc_amf
  goal: auto
  nvenc_preset: p6
  nvenc_tune: hq
  nvenc_rc: vbr
  nvenc_cq: 19
  nvenc_bitrate: 0
  nvenc_multipass: qres
  nvenc_rc_lookahead: 32
  nvenc_spatial_aq: true
  nvenc_temporal_aq: false
  nvenc_bframes: 3
  nvenc_b_ref_mode: middle
  qsv_preset: medium
  qsv_global_quality: 22
  qsv_extbrc: true
  qsv_look_ahead_depth: 40
  qsv_bf: 3
  qsv_low_power: false
  amf_bit_depth: '8'
  amf_quality: quality
  amf_rc: vbr_peak
  amf_qp_i: 19
  amf_qp_p: 19
  amf_qp_b: 20
  amf_bitrate: 10000000
  amf_maxrate: 20000000
  amf_bufsize: 40000000
  amf_preanalysis: true
  amf_vbaq: false
  amf_preencode: true
  amf_g: 0
  amf_bf: 3
  amf_pa_lookahead_buffer_depth: -1
  amf_pa_taq_mode: -1
  d3d12_qp: 21
  d3d12_quality: -1
  vulkan_qp: 21
  vulkan_quality: -1
  vulkan_async_depth: 2
  x_crf: 18
  x_preset: slow
  x_tune: animation
  x265_params: aq-mode=3:psy-rd=2.0:psy-rdoq=1.0:rd=4
  extra_args: []
decode:
  hwaccel: auto
  png_intermediate_codec: mjpeg
frame_dedupe:
  enabled: false
  threshold: 5.0e-06
  protect_scene_cuts: true
streams:
  copy_audio: true
  copy_subtitles: true
  copy_chapters: true
  copy_attachments: true
  copy_global_metadata: true
  copy_stream_metadata: true
  copy_dispositions: true
  burn_in_subtitles: false
postprocess:
  enabled: false
  deband: false
  deblock: false
  grain_addback: 0
batching:
  mode: manual
  enabled: true
  chunk_seconds: 30
  boundary_policy: keyframe
