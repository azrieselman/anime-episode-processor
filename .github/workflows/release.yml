name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-source-artifacts:
    name: build sdist + wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist + wheel
        shell: pwsh
        run: python -m build

      - name: Upload sdist + wheel as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aep-source-artifacts-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error

      - name: Attach sdist + wheel to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          fail_on_unmatched_files: true
