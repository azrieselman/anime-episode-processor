meta:
  id: anime_quality
  name: Anime Quality
  description: >
    Highest-quality anime path. Real-ESRGAN x4 with RIFE v4.6 and software
    x265 output, while preserving equivalent quality-oriented knobs for NVENC,
    QSV, and AMF when users switch backend.
  builtin: true
  suitable_for: [anime_2d, anime_compressed]
  target_hardware: "Strong GPU for frame stages and 8+ CPU cores for x265"
container: mkv
target_resolution:
  mode: named
  named: "1440p"
upscaler:
  engine: realesrgan-ncnn-vulkan
  model: realesr-animevideov3
  scale: 4
  denoise: -1
  tile_size: 192
  fp16: true
  enabled: true
interpolation:
  enabled: true
  engine: rife-ncnn-vulkan
  version: v4.6
  target_fps: 60
  scene_cut_threshold: 0.4
  duplicate_on_scene_cut: true
  fp16: true
encoder:
  name: libx265
  goal: quality
  nvenc_preset: p7
  nvenc_tune: hq
  nvenc_rc: vbr
  nvenc_cq: 18
  nvenc_multipass: fullres
  nvenc_rc_lookahead: 32
  nvenc_spatial_aq: true
  nvenc_temporal_aq: true
  nvenc_bframes: 4
  nvenc_b_ref_mode: middle
  qsv_preset: veryslow
  qsv_global_quality: 20
  qsv_extbrc: true
  qsv_look_ahead_depth: 50
  qsv_bf: 4
  qsv_low_power: false
  amf_quality: high_quality
  amf_rc: cqp
  amf_qp_i: 18
  amf_qp_p: 18
  amf_qp_b: 19
  amf_preanalysis: true
  amf_vbaq: false
  amf_g: 250
  x_crf: 17
  x_preset: slow
  x_tune: null
  x265_params: aq-mode=3:psy-rd=2.0:psy-rdoq=1.0:rd=4
  extra_args: ["-x265-params", "aq-mode=3:psy-rd=2.0:psy-rdoq=1.0:rd=4"]
decode:
  hwaccel: auto
  png_intermediate_codec: mjpeg
streams:
  copy_audio: true
  copy_subtitles: true
  copy_chapters: true
  copy_attachments: true
  copy_global_metadata: true
  copy_stream_metadata: true
  copy_dispositions: true
  burn_in_subtitles: false
postprocess:
  enabled: false
  deband: false
  deblock: false
  grain_addback: 0
