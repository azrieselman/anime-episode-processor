meta:
  id: anime_quality
  name: Anime Quality
  description: >
    Highest-quality anime path. Real-ESRGAN x4 anime model downscaled to target,
    RIFE v4.6 with high-quality params, x265 slow CRF 17. Slower than NVENC.
  builtin: true
  suitable_for: [anime_2d, anime_compressed]
  target_hardware: "RTX 3000 series; CPU 8c+ recommended for x265"
container: mkv
target_resolution:
  mode: named
  named: "1440p"
upscaler:
  engine: realesrgan-ncnn-vulkan
  model: realesr-animevideov3
  scale: 4
  denoise: -1
  tile_size: 192
  fp16: true
  enabled: true
interpolation:
  enabled: true
  engine: rife-ncnn-vulkan
  version: v4.6
  target_fps: 60
  scene_cut_threshold: 0.4
  duplicate_on_scene_cut: true
  fp16: true
encoder:
  name: libx265
  nvenc_preset: p7
  nvenc_tune: hq
  nvenc_rc: vbr
  nvenc_cq: 18
  nvenc_multipass: fullres
  nvenc_spatial_aq: true
  nvenc_temporal_aq: true
  nvenc_bframes: 4
  nvenc_b_ref_mode: middle
  x_crf: 17
  x_preset: slow
  x_tune: null
  extra_args: ["-x265-params", "aq-mode=3:psy-rd=2.0:psy-rdoq=1.0:rd=4"]
streams:
  copy_audio: true
  copy_subtitles: true
  copy_chapters: true
  copy_attachments: true
  copy_global_metadata: true
  copy_stream_metadata: true
  copy_dispositions: true
  burn_in_subtitles: false
postprocess:
  enabled: false
  deband: false
  deblock: false
  grain_addback: 0
